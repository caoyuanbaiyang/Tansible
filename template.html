<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <title>Tansible执行结果</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f4f9;
            color: #333;
            line-height: 1.5;
            letter-spacing: 0.02em;
        }
        .container {
            max-width: 2500px;
            margin: 0 auto;
            padding: 2rem;
        }
        h1 {
            font-size: 2.25rem;
            font-weight: 700;
            text-align: center;
            color: #2d3748;
            margin-bottom: 2rem;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            background-color: #fff;
        }
        th, td {
            border: 1px solid #e2e8f0;
            padding: 1rem;
            text-align: left;
        }
        th {
            background-color: #edf2f7;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.875rem;
        }
        tr:nth-child(even) {
            background-color: #f7fafc;
        }
        tr:hover {
            background-color: #edf2f7;
            transition: background-color 0.3s ease;
        }
        .failed-row {
            color: red;
        }
        .input-info {
            margin-bottom: 2rem;
            padding: 1rem;
            background-color: #edf2f7;
            border-radius: 0.375rem;
        }

        /* 筛选控件样式 */
        .filter-container {
            margin-bottom: 1.5rem;
            padding: 1rem;
            background-color: #f7fafc;
            border-radius: 0.375rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1rem;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }
        .filter-label {
            font-weight: 600;
            color: #2d3748;
            font-size: 0.875rem;
            white-space: nowrap;
        }
        .filter-control {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }
        .filter-select {
            padding: 0.5rem 0.75rem;
            border: 1px solid #e2e8f0;
            border-radius: 0.375rem;
            background-color: #fff;
            min-width: 110px;
            font-size: 0.9rem;
        }
        .filter-select:focus, .filter-input:focus {
            outline: none;
            border-color: #4299e1;
            box-shadow: 0 0 0 2px rgba(66, 153, 225, 0.25);
        }
        .filter-input {
            flex: 1;
            padding: 0.5rem 0.75rem;
            border: 1px solid #e2e8f0;
            border-radius: 0.375rem;
            background-color: #fff;
            min-width: 120px;
            font-size: 0.9rem;
        }
        .filter-input:disabled {
            background-color: #edf2f7;
            color: #a0aec0;
            cursor: not-allowed;
        }
        .second-input {
            min-width: 80px;
        }
        .result-count {
            color: #4a5568;
            font-size: 0.9rem;
            font-weight: 500;
            white-space: nowrap;
            margin-left: auto;
            align-self: center;
        }
        .status-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tansible执行结果</h1>
        <div class="input-info">
            <h2 class="text-xl font-bold mb-2">执行参数</h2>
            <p><strong>主机文件路径:</strong> {{host_file_path}}</p>
            <p><strong>群组文件路径:</strong> {{group_file_path}}</p>
            <p><strong>动作文件路径:</strong> {{action_file_path}}</p>
            <p><strong>并发线程数:</strong> {{max_workers}}</p>
        </div>

        <!-- 筛选控件 + 结果行数统计 -->
        <div class="filter-container">
            <div class="status-group">
                <label class="filter-label" for="resultFilter">执行结果</label>
                <select id="resultFilter" class="filter-select">
                    <option value="all">全部结果</option>
                    <option value="success">成功</option>
                    <option value="failed">失败</option>
                </select>
            </div>

            <div class="filter-group">
                <label class="filter-label">任务</label>
                <div class="filter-control">
                    <select id="taskOp" class="filter-select" data-target="taskValue">
                        <option value="contains">包含</option>
                        <option value="not_contains">不包含</option>
                        <option value="eq">等于</option>
                        <option value="ne">不等于</option>
                        <option value="empty">为空</option>
                        <option value="not_empty">不为空</option>
                    </select>
                    <input type="text" id="taskValue" class="filter-input" placeholder="输入任务名称">
                </div>
            </div>

            <div class="filter-group">
                <label class="filter-label">模块名</label>
                <div class="filter-control">
                    <select id="moduleOp" class="filter-select" data-target="moduleValue">
                        <option value="contains">包含</option>
                        <option value="not_contains">不包含</option>
                        <option value="eq">等于</option>
                        <option value="ne">不等于</option>
                        <option value="empty">为空</option>
                        <option value="not_empty">不为空</option>
                    </select>
                    <input type="text" id="moduleValue" class="filter-input" placeholder="输入模块名">
                </div>
            </div>

            <div class="filter-group">
                <label class="filter-label">主机名</label>
                <div class="filter-control">
                    <select id="hostOp" class="filter-select" data-target="hostValue">
                        <option value="contains">包含</option>
                        <option value="not_contains">不包含</option>
                        <option value="eq">等于</option>
                        <option value="ne">不等于</option>
                        <option value="empty">为空</option>
                        <option value="not_empty">不为空</option>
                    </select>
                    <input type="text" id="hostValue" class="filter-input" placeholder="输入主机名">
                </div>
            </div>

            <div class="filter-group">
                <label class="filter-label">执行秒数</label>
                <div class="filter-control">
                    <select id="secondOp" class="filter-select" data-target="secondValue">
                        <option value="none">不筛选</option>
                        <option value="gt">大于</option>
                        <option value="gte">大于等于</option>
                        <option value="eq">等于</option>
                        <option value="lt">小于</option>
                        <option value="lte">小于等于</option>
                        <option value="empty">为空</option>
                        <option value="not_empty">不为空</option>
                    </select>
                    <input type="number" id="secondValue" class="filter-input second-input" placeholder="输入数值" min="0">
                </div>
            </div>

            <div class="filter-group">
                <label class="filter-label">返回结果</label>
                <div class="filter-control">
                    <select id="contentOp" class="filter-select" data-target="contentValue">
                        <option value="contains">包含</option>
                        <option value="not_contains">不包含</option>
                        <option value="eq">等于</option>
                        <option value="ne">不等于</option>
                        <option value="empty">为空</option>
                        <option value="not_empty">不为空</option>
                    </select>
                    <input type="text" id="contentValue" class="filter-input" placeholder="输入返回结果内容">
                </div>
            </div>

            <span class="result-count" id="resultCount">共 0 条结果</span>
        </div>

        <table>
            <thead>
                <tr>
                    <th style="width: 5%">执行结果</th>
                    <th style="width: 15%">任务</th>
                    <th style="width: 10%">模块名</th>
                    <th style="width: 15%">主机名</th>
                    <th style="width: 5%">执行秒数</th>
                    <th style="width: 50%">返回结果</th>
                </tr>
            </thead>
            <tbody id="resultTableBody">
                {{table_rows}}
            </tbody>
        </table>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const resultFilter = document.getElementById('resultFilter');
            const resultCountSpan = document.getElementById('resultCount');
            const tableBody = document.getElementById('resultTableBody');
            const tableRows = tableBody.querySelectorAll('tr');

            const textFilters = [
                { opId: 'taskOp', valueId: 'taskValue', colIndex: 1 },
                { opId: 'moduleOp', valueId: 'moduleValue', colIndex: 2 },
                { opId: 'hostOp', valueId: 'hostValue', colIndex: 3 },
                { opId: 'contentOp', valueId: 'contentValue', colIndex: 5 }
            ];
            const numberFilter = { opId: 'secondOp', valueId: 'secondValue', colIndex: 4 };

            function setupInputToggle(opId, valueId) {
                const opEl = document.getElementById(opId);
                const valueEl = document.getElementById(valueId);
                opEl.addEventListener('change', () => {
                    const disabled = opEl.value === 'empty' || opEl.value === 'not_empty';
                    valueEl.disabled = disabled;
                    if (disabled) valueEl.value = '';
                    filterResults();
                });
            }
            textFilters.forEach(f => setupInputToggle(f.opId, f.valueId));
            setupInputToggle(numberFilter.opId, numberFilter.valueId);

            function matchText(value, op, input) {
                switch (op) {
                    case 'contains': return value.includes(input);
                    case 'not_contains': return !value.includes(input);
                    case 'eq': return value === input;
                    case 'ne': return value !== input;
                    case 'empty': return value === '';
                    case 'not_empty': return value !== '';
                    default: return true;
                }
            }

            function matchNumber(cellValue, op, inputValue) {
                if (op === 'empty') return cellValue === '';
                if (op === 'not_empty') return cellValue !== '';
                if (op === 'none') return true;
                const num = parseFloat(cellValue);
                const inputNum = parseFloat(inputValue);
                if (isNaN(num) || isNaN(inputNum)) return false;
                switch (op) {
                    case 'gt': return num > inputNum;
                    case 'gte': return num >= inputNum;
                    case 'eq': return num === inputNum;
                    case 'lt': return num < inputNum;
                    case 'lte': return num <= inputNum;
                    default: return true;
                }
            }

            function filterResults() {
                const resultValue = resultFilter.value.toLowerCase().trim();
                let visibleCount = 0;

                tableRows.forEach(row => {
                    const cells = row.querySelectorAll('td');
                    if (cells.length < 6) return;

                    const rowResult = cells[0].textContent.trim().toLowerCase();
                    const isResultMatch = resultValue === 'all' || rowResult === resultValue;

                    let isTextMatch = true;
                    for (const f of textFilters) {
                        const op = document.getElementById(f.opId).value;
                        const input = document.getElementById(f.valueId).value.toLowerCase().trim();
                        const cellValue = cells[f.colIndex].textContent.trim().toLowerCase();
                        if (!matchText(cellValue, op, input)) {
                            isTextMatch = false;
                            break;
                        }
                    }

                    const secondOp = document.getElementById(numberFilter.opId).value;
                    const secondInput = document.getElementById(numberFilter.valueId).value;
                    const secondCellValue = cells[numberFilter.colIndex].textContent.trim();
                    const isSecondMatch = matchNumber(secondCellValue, secondOp, secondInput);

                    if (isResultMatch && isTextMatch && isSecondMatch) {
                        row.style.display = '';
                        visibleCount++;
                    } else {
                        row.style.display = 'none';
                    }
                });

                resultCountSpan.textContent = `共 ${visibleCount} 条结果`;
            }

            resultFilter.addEventListener('change', filterResults);
            textFilters.forEach(f => {
                document.getElementById(f.opId).addEventListener('change', filterResults);
                document.getElementById(f.valueId).addEventListener('input', filterResults);
            });
            document.getElementById(numberFilter.opId).addEventListener('change', filterResults);
            document.getElementById(numberFilter.valueId).addEventListener('input', filterResults);

            filterResults();
        });
    </script>
</body>
</html>
